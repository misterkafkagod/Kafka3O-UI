# S3-compatible test storage for the s3-backup-connectors discovery (M13): SeaweedFS 4.51 (Apache 2.0) with its
# S3 API on a local volume of eksd-01. Credentials come from Secret seaweedfs-s3-config (s3.json), generated on
# the node. Remove with: kubectl delete namespace kafka3o-backup-storage; kubectl delete pv kafka3o-backup-storage;
# sudo rm -rf /var/lib/kafka3o-backup-storage
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kafka3o-backup-storage
spec:
  capacity: { storage: 10Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: kafka3o-backup-storage
  local: { path: /var/lib/kafka3o-backup-storage }
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: kubernetes.io/hostname, operator: In, values: [eksd-01] }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  namespace: kafka3o-backup-storage
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: kafka3o-backup-storage
  volumeName: kafka3o-backup-storage
  resources:
    requests: { storage: 10Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: kafka3o-backup-storage
  labels: { app.kubernetes.io/name: seaweedfs }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: seaweedfs }
  template:
    metadata:
      labels: { app.kubernetes.io/name: seaweedfs }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, fsGroupChangePolicy: OnRootMismatch, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.51
          args: ["server", "-dir=/data", "-ip=127.0.0.1", "-ip.bind=0.0.0.0", "-s3", "-s3.port=8333",
                 "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=1024", "-volume.max=8"]
          ports:
            - { containerPort: 8333, name: s3 }
          readinessProbe:
            tcpSocket: { port: 8333 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: s3-config, mountPath: /etc/seaweedfs, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: seaweedfs-data }
        - name: s3-config
          secret: { secretName: seaweedfs-s3-config }
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3
  namespace: kafka3o-backup-storage
spec:
  selector: { app.kubernetes.io/name: seaweedfs }
  ports:
    - { name: s3, port: 8333, targetPort: 8333 }
